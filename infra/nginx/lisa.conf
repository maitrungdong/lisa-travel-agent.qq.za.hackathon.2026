# =============================================================================
#  Lisa Travel Agent — vhost cho nginx CÓ SẴN của BTC trên VPS.
#
#  File này được copy vào /etc/nginx/conf.d/lisa.conf (scripts/vps-bootstrap.sh làm).
#  Nguyên tắc bất di bất dịch: KHÔNG sửa, KHÔNG xoá, KHÔNG restart config của BTC
#  (/etc/nginx/conf.d/star.123c.vn.conf). Chỉ THÊM file này rồi `nginx -s reload`.
#  Reload là thao tác nóng: nginx nạp config mới cho worker mới, không rớt kết nối.
#
#  Vì sao an toàn khi chạy song song với vhost `*.123c.vn` của BTC:
#   - nginx chọn server block theo độ ưu tiên: tên CHÍNH XÁC > wildcard.
#     `zah19-team35.123c.vn` (file này) thắng `*.123c.vn` (BTC) → các host khác
#     của BTC vẫn đi đúng đường cũ.
#   - Ở đây KHÔNG dùng `default_server`, KHÔNG dùng `http2`/`backlog`/`ipv6only`
#     trên `listen` để tránh lỗi "duplicate listen options" với block của BTC.
#     Socket 443 do block của BTC mở trước; mình chỉ ghép thêm vhost vào đó.
#
#  Bản đồ đường dẫn:
#     /zalo/   → 127.0.0.1:3000  (giữ nguyên prefix)  webhook Zalo Bot
#     /api/    → 127.0.0.1:3000  (CẮT prefix /api)    BFF cho Mini App
#     /media/  → /opt/lisa/media                      ảnh cho sendPhoto
#     /trip/   → /opt/lisa/recap                      trang tổng kết chuyến đi
# =============================================================================

# --- Upstream: container api bind 127.0.0.1:3000 (docker compose) -------------
upstream lisa_api {
    server 127.0.0.1:3000;
    keepalive 32;             # tái dùng kết nối, giảm latency cho webhook
}

# --- HTTP :80 → ép về HTTPS ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zah19-team35.123c.vn;

    # Zalo chỉ gọi webhook qua HTTPS; giữ redirect để mọi link http đều lên 443.
    return 301 https://$host$request_uri;
}

# --- HTTPS :443 ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zah19-team35.123c.vn;

    # -------------------------------------------------------------------------
    # CHỨNG CHỈ — dùng ĐÚNG cert wildcard BTC đã cài, không xin cert mới.
    #
    # Trên VPS chỉ chắc chắn có: /etc/nginx/certs/123c.vn.pem
    # Có 2 khả năng và cả 2 đều được hỗ trợ:
    #
    #   (A) Cert và key nằm ở 2 file  →  giữ nguyên 2 dòng dưới đây:
    #         ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    #         ssl_certificate_key /etc/nginx/certs/123c.vn.key;
    #
    #   (B) File .pem là "combined" (cert + private key trong cùng 1 file, không
    #       có file .key riêng) → CẢ HAI dòng trỏ vào .pem:
    #         ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    #         ssl_certificate_key /etc/nginx/certs/123c.vn.pem;
    #       (nginx cho phép key nằm chung file với cert)
    #
    # vps-bootstrap.sh TỰ PHÁT HIỆN và sửa dòng `ssl_certificate_key` cho đúng,
    # theo thứ tự ưu tiên:
    #   1. đọc `ssl_certificate_key` trong conf của BTC (star.123c.vn.conf)
    #   2. nếu tồn tại /etc/nginx/certs/123c.vn.key → dùng file đó
    #   3. ngược lại → trỏ vào chính file .pem (trường hợp B)
    # Nếu copy tay file này thì tự kiểm tra bằng:
    #   sudo ls -l /etc/nginx/certs/ && sudo grep -n ssl_certificate /etc/nginx/conf.d/star.123c.vn.conf
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    ssl_certificate_key /etc/nginx/certs/123c.vn.key;   # bootstrap có thể sửa dòng này

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LisaSSL:5m;
    ssl_session_timeout 1h;

    # Log riêng để debug không lẫn với traffic của BTC
    access_log /var/log/nginx/lisa.access.log;
    error_log  /var/log/nginx/lisa.error.log warn;

    # Mặc định cho vhost này (từng location có thể ghi đè)
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # 1) WEBHOOK ZALO BOT — /zalo/...
    #    Prefix ĐƯỢC GIỮ NGUYÊN (proxy_pass không có "/" ở cuối) → API nhận
    #    đúng path POST /zalo/webhook.
    # -------------------------------------------------------------------------
    location /zalo/ {
        proxy_pass http://lisa_api;

        # Payload có thể kèm metadata ảnh → 10m cho thoải mái.
        client_max_body_size 10m;
        # Zalo timeout webhook rất ngắn; gateway phải ack <100ms. 30s là trần an toàn.
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 5s;

        # BẮT BUỘC: header xác thực của Zalo. nginx vốn tự chuyển tiếp header
        # không chuẩn, nhưng khai báo tường minh để không ai vô tình xoá.
        proxy_set_header X-Bot-Api-Secret-Token $http_x_bot_api_secret_token;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook không cần buffer — đẩy thẳng cho nhanh
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------------------
    # 2) BFF CHO MINI APP — /api/...
    #    Prefix /api BỊ CẮT (proxy_pass CÓ "/" ở cuối):
    #        /api/health      → GET /health   (HealthController)
    #        /api/trips/12    → GET /trips/12 (TripsController)
    #    → Mini App set VITE_API_BASE_URL=https://zah19-team35.123c.vn/api
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://lisa_api/;

        client_max_body_size 10m;
        # Deep plan / recap chạy lâu (Claude + web_search) → nới lên 120s.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS do NestJS xử lý (biến CORS_ORIGINS). KHÔNG thêm header CORS ở đây,
        # thêm nữa là trình duyệt thấy 2 giá trị Access-Control-Allow-Origin và chặn.
        # Riêng preflight vẫn phải đi tới API — không chặn OPTIONS ở tầng nginx.

        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # 3) ẢNH — /media/...  → /opt/lisa/media/
    #    Container api tải ảnh từ Zalo về đây rồi trả URL công khai lại cho
    #    sendPhoto (Zalo yêu cầu URL public, không nhận multipart).
    #    LƯU Ý dấu "/" cuối cả `location` lẫn `alias` — thiếu là 404 hoặc path traversal.
    # -------------------------------------------------------------------------
    location /media/ {
        alias /opt/lisa/media/;

        autoindex off;                 # không cho liệt kê thư mục
        # Ảnh là immutable (tên theo uuid) → cache 7 ngày.
        # `expires` đã tự set cả Expires lẫn Cache-Control: max-age=604800,
        # nên KHÔNG thêm add_header Cache-Control nữa (sẽ bị lặp header).
        expires 7d;
        add_header X-Content-Type-Options "nosniff";

        # File chưa kịp ghi xong / sai tên → 404 gọn, không dump lỗi
        try_files $uri =404;

        # Nếu sau này SELinux bật Enforcing thì phải gán context cho nginx đọc:
        #   sudo chcon -R -t httpd_sys_content_t /opt/lisa/media
        # (hiện VPS đang Permissive nên chưa cần)
    }

    # -------------------------------------------------------------------------
    # 4) TRANG TỔNG KẾT CHUYẾN ĐI — /trip/...  → /opt/lisa/recap/
    #    Agent dựng HTML tĩnh vào /opt/lisa/recap/<tripId>/index.html.
    # -------------------------------------------------------------------------
    location /trip/ {
        alias /opt/lisa/recap/;

        autoindex off;
        # try_files hoạt động đúng với alias ở location dạng prefix:
        #   /trip/42/        → /opt/lisa/recap/42/index.html
        #   /trip/42/a.css   → /opt/lisa/recap/42/a.css
        try_files $uri $uri/index.html =404;

        # Trang recap có thể được agent ghi đè lại → cache ngắn thôi
        expires 5m;
        add_header X-Content-Type-Options "nosniff";
    }

    # -------------------------------------------------------------------------
    # 5) Còn lại: 404 rỗng. Không serve /usr/share/nginx/html của BTC.
    # -------------------------------------------------------------------------
    location = / {
        default_type text/plain;
        return 200 "Lisa Travel Agent - OK\n";
    }

    location / {
        return 404;
    }
}
