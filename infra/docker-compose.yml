# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Stack Zino trên VPS — CHỈ 2 service: postgres + api.                      │
# │                                                                          │
# │ KHÔNG có caddy, KHÔNG có openclaw. Lý do:                                │
# │  • nginx của BTC đang giữ 80/443 với wildcard cert *.123c.vn → mình chỉ  │
# │    THÊM 1 file conf (infra/nginx/zino.conf), không dựng reverse proxy #2. │
# │  • Toàn bộ logic agent (webhook Zalo + worker + tool) nằm trong api.     │
# │                                                                          │
# │ Luồng vào:                                                               │
# │   Internet :443 → nginx (BTC) ├─ /zalo/  → 127.0.0.1:3000  (webhook)     │
# │                               ├─ /api/   → 127.0.0.1:3000  (BFF Mini App)│
# │                               ├─ /media/ → /opt/zino/media (ảnh)         │
# │                               └─ /trip/  → /opt/zino/recap (trang recap) │
# │                                                                          │
# │ Chạy trên VPS:                                                           │
# │   cd /opt/zino && cp .env.example .env && vi .env && docker compose up -d │
# └──────────────────────────────────────────────────────────────────────────┘

# ⚠ ĐỌC TRƯỚC KHI ĐỔI DÒNG DƯỚI ĐÂY.
#
# Tên project quyết định TIỀN TỐ của tên volume. Đổi nó là Docker trỏ sang một
# volume KHÁC — và nếu volume đó chưa tồn tại thì compose lặng lẽ tạo một cái
# RỖNG rồi khởi động Postgres trên đó. Không có lỗi, không có cảnh báo, chỉ là
# toàn bộ hội thoại / chuyến đi / chi phí biến mất.
#
# Suýt xảy ra thật lúc 03:26 ngày 29/07: VPS chạy project `lisa` (từ thời tên
# cũ), file này ghi `zino`, và một lệnh `cp` đè file đã tạo `zino_pgdata` rỗng.
# Cứu được nhờ đúng một tình cờ — cổng 5432 còn bị stack cũ chiếm.
#
# Nên volume ở cuối file này nay ĐẶT TÊN CỨNG, không suy ra từ project name.
# Đổi `name:` ở đây giờ chỉ đổi tên container, không đụng tới dữ liệu.
name: zino

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ⚠ CHỈ có tác dụng khi volume RỖNG. Volume production đã init từ thời
      # "lisa" nên role vẫn là lisa — đặt cứng "zino" ở đây là api đăng nhập
      # sai và crash-loop với 28P01. Để env quyết, mặc định khớp production.
      # Đổi thật sự cần dump/restore: xem docs/setup/10-doi-sang-bot-zino.md
      POSTGRES_USER: ${POSTGRES_USER:-lisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-lisa}
      # Giờ VN cho cả server DB — reminder/lịch trình phụ thuộc trực tiếp vào đây
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    # Chỉ bind loopback. Từ máy dev chạy migration qua SSH tunnel (scripts/deploy.sh lo).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lisa} -d ${POSTGRES_DB:-lisa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    # Image do .github/workflows/deploy-api.yml build & push lên GHCR.
    image: ${API_IMAGE:?thiếu API_IMAGE trong .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bind loopback — nginx của BTC proxy vào đây. KHÔNG expose ra 0.0.0.0,
    # nếu không sẽ lộ API trần (không TLS) ra internet qua http://IP:3000.
    ports:
      - "127.0.0.1:3000:3000"
    # ⚠ File này KHÔNG dùng env_file — biến nào không có tên trong khối
    # `environment:` dưới đây thì .env chỉ dùng để NỘI SUY, không bao giờ vào
    # được container. Đã dính một lần với nhóm biến ZINO_*: .env đủ, container
    # rỗng, và mọi đường v7 bị short-circuit trong im lặng.
    #
    # Thêm biến mới → PHẢI thêm một dòng ở đây, không chỉ ở .env.
    environment:
      PORT: "3000"
      # Giờ VN — để mặc định (UTC/EDT) là mọi reminder lệch 7–11 tiếng
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgres://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lisa}
      # Origin được phép gọi /api/ từ trình duyệt (Mini App chạy trên h5.zdn.vn)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://h5.zdn.vn}
      # Bảo vệ các endpoint ghi dữ liệu (worker/agent gọi nội bộ)
      AGENT_API_KEY: ${AGENT_API_KEY:?thiếu AGENT_API_KEY trong .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?thiếu ANTHROPIC_API_KEY trong .env}
      # Partner Network — để trống là tắt tính năng, phần còn lại vẫn chạy bình thường
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      # Ký JWT phiên của Mini App. Bỏ trống → dùng AGENT_API_KEY (vẫn là bí mật
      # của server). Đổi giá trị này = đăng xuất toàn bộ người dùng.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ZALO_OA_SECRET: ${ZALO_OA_SECRET:-}
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:?thiếu ZALO_BOT_TOKEN trong .env}
      # Tên hiển thị của bot, đúng như Zalo chèn vào đầu tin nhắn nhóm.
      # Lấy bằng: curl -s https://<domain>/zalo/info | jq -r .me.display_name
      # Không đặt thì trigger/cửa thoát rơi về cách khớp nới lỏng hơn (khớp ở
      # cuối câu) — vẫn chạy, nhưng kém chính xác.
      ZALO_BOT_NAME: ${ZALO_BOT_NAME:-}

      # ── Agent System v7 — ba agent Intake / Brain / Finalizer ──
      # Tắt cờ = mọi đường v7 short-circuit, bot chạy y như trước.
      # Để trống hết cũng an toàn: v7Enabled() trả false.
      ZINO_V7_ENABLED: ${ZINO_V7_ENABLED:-0}
      ZINO_AGENT_API_KEY: ${ZINO_AGENT_API_KEY:-}
      ZINO_AGENT_ENV_ID: ${ZINO_AGENT_ENV_ID:-}
      ZINO_AGENT_INTAKE_ID: ${ZINO_AGENT_INTAKE_ID:-}
      ZINO_AGENT_BRAIN_ID: ${ZINO_AGENT_BRAIN_ID:-}
      ZINO_AGENT_FINALIZER_ID: ${ZINO_AGENT_FINALIZER_ID:-}
      # Để trống là dùng mặc định trong code (45s / 300s / 90s). An toàn vì
      # envInt() chịu được chuỗi rỗng — xem pipeline.types.ts.
      ZINO_INTAKE_TIMEOUT_MS: ${ZINO_INTAKE_TIMEOUT_MS:-}
      ZINO_BRAIN_TIMEOUT_MS: ${ZINO_BRAIN_TIMEOUT_MS:-}
      ZINO_FINALIZER_TIMEOUT_MS: ${ZINO_FINALIZER_TIMEOUT_MS:-}

      # ── Van xả khi flow v7 kẹt ──
      # Mặc định 24h. Ngày demo nên hạ xuống 3600000 (1h): một flow hỏng mà
      # không ai gõ "thoát" sẽ tự khỏi sau một giờ thay vì một ngày.
      ZINO_PIPELINE_TTL_MS: ${ZINO_PIPELINE_TTL_MS:-}

      # ── Chỉnh nóng không cần build lại image ──
      # Header beta của Managed Agents còn đang thay đổi; để ở đây thì Anthropic
      # đổi phiên bản là sửa .env + restart, không phải dựng lại image.
      ZINO_MANAGED_AGENTS_BETA: ${ZINO_MANAGED_AGENTS_BETA:-}
      ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-}
      # Model của từng đường. Đổi được lúc chạy là công cụ hạ chi phí/độ trễ
      # nhanh nhất khi demo bị chậm.
      ZINO_MODEL: ${ZINO_MODEL:-}
      ZINO_PLANNER_MODEL: ${ZINO_PLANNER_MODEL:-}
      ZINO_RECAP_MODEL: ${ZINO_RECAP_MODEL:-}
      ZINO_REFLECTION_MODEL: ${ZINO_REFLECTION_MODEL:-}
      ZINO_MERCHANT_MODEL: ${ZINO_MERCHANT_MODEL:-}
      ZINO_CHAT_MODEL: ${ZINO_CHAT_MODEL:-}
      # Sticker "đang nghĩ" lúc deep_plan — ID lấy từ log "Sticker nhận được"
      ZINO_STICKER_THINKING: ${ZINO_STICKER_THINKING:-}
      # Link Mini App gửi kèm khi nhóm chốt một quyết định
      ZINO_MINIAPP_URL: ${ZINO_MINIAPP_URL:-}
      # Cửa sổ gộp tin (1200ms) và trần thời gian một lượt (75s)
      ZINO_BATCH_WINDOW_MS: ${ZINO_BATCH_WINDOW_MS:-}
      ZINO_TURN_TIMEOUT_MS: ${ZINO_TURN_TIMEOUT_MS:-}

      # ── Outcome Agent — MỘT agent, Research Brain chạy nội bộ ──
      # Thay ruột job `deep_plan`. Tắt cờ hoặc bỏ trống ID là rơi về
      # opus-5 + web_search như cũ, không mất tính năng nào.
      ZINO_OUTCOME_ENABLED: ${ZINO_OUTCOME_ENABLED:-0}
      ZINO_AGENT_OUTCOME_ID: ${ZINO_AGENT_OUTCOME_ID:-}
      # Mặc định 180s. Plan đề xuất 90s nhưng đó là mục tiêu chưa đo — Brain
      # đơn lẻ đo được 155s và 205s ngày 29/07. Đo bản có trần tool rồi hạ.
      ZINO_OUTCOME_TIMEOUT_MS: ${ZINO_OUTCOME_TIMEOUT_MS:-}
      # Mượn agent v4 làm bộ máy nghiên cứu cho job deep_plan của v1.
      # ĐỘC LẬP với ZINO_OUTCOME_ENABLED: bật cái này thì v1 vẫn là cửa trước
      # với đủ 21 tool, chỉ phần research chạy nền là đi qua agent.
      ZINO_DEEP_PLAN_VIA_AGENT: ${ZINO_DEEP_PLAN_VIA_AGENT:-0}

      # ── R4.3 Memory-first — CHỈ kênh Zalo ──
      # Bật cờ này là Outcome Agent thay hẳn AgentService trên Zalo: không tool,
      # không ghi DB, trạng thái nằm trong Claude Memory Store.
      # Mini App KHÔNG ảnh hưởng — nó đi ChatController → ChatAgent, đường riêng.
      # Tắt cờ là về v1 nguyên trạng, không mất dữ liệu.
      ZINO_R43_ENABLED: ${ZINO_R43_ENABLED:-0}
      ZINO_R43_OUTCOME_AGENT_ID: ${ZINO_R43_OUTCOME_AGENT_ID:-}
      # Chỉ áp R4.3 cho những nhóm liệt kê (chat id, ngăn bằng dấu phẩy).
      # Bỏ trống = áp cho TẤT CẢ. Dùng để thử R4.3 ở nhóm test mà không đụng
      # nhóm demo đang chạy v1.
      ZINO_R43_GROUPS: ${ZINO_R43_GROUPS:-}
      # Ghim version để rollout có kiểm soát; bỏ trống = luôn bản mới nhất
      ZINO_R43_OUTCOME_AGENT_VERSION: ${ZINO_R43_OUTCOME_AGENT_VERSION:-}
      # Bỏ trống thì rơi về ZINO_AGENT_ENV_ID
      ZINO_R43_ENVIRONMENT_ID: ${ZINO_R43_ENVIRONMENT_ID:-}
      ZINO_R43_TIMEOUT_MS: ${ZINO_R43_TIMEOUT_MS:-}
      # Catalog OA upload MỘT LẦN lúc deploy, không phải mỗi nhóm
      ZINO_OA_FILE_ID: ${ZINO_OA_FILE_ID:-}
      ZINO_OA_MOUNT_PATH: ${ZINO_OA_MOUNT_PATH:-}
      # Hai store dựng sẵn cho nhóm demo — đặt thì KHÔNG tạo cặp mới
      ZINO_DEMO_GROUP_MEMORY_STORE_ID: ${ZINO_DEMO_GROUP_MEMORY_STORE_ID:-}
      ZINO_DEMO_TRIP_MEMORY_STORE_ID: ${ZINO_DEMO_TRIP_MEMORY_STORE_ID:-}
      # Doc chính thức nói Memory dùng managed-agents-2026-04-01; handoff của
      # team nói agent-memory-2026-07-22. Gặp 400 thì đổi ở đây, khỏi build lại.
      ZINO_MEMORY_BETA: ${ZINO_MEMORY_BETA:-}

      # ── Pipeline 4 agent (v2) — giữ lại, mặc định tắt ──
      ZINO_PIPELINE_ENABLED: ${ZINO_PIPELINE_ENABLED:-0}
      ZINO_AGENT_A_ID: ${ZINO_AGENT_A_ID:-}
      ZINO_AGENT_B_ID: ${ZINO_AGENT_B_ID:-}
      ZINO_AGENT_C_ID: ${ZINO_AGENT_C_ID:-}
      ZINO_AGENT_D_ID: ${ZINO_AGENT_D_ID:-}
      # Zalo gửi kèm header X-Bot-Api-Secret-Token = đúng giá trị này ở mỗi webhook
      ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET:?thiếu ZALO_WEBHOOK_SECRET trong .env}
      # Dùng để dựng URL công khai cho ảnh (sendPhoto cần URL public) và link recap
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://zah-35.123c.vn}
      # Đường dẫn TRONG container; nginx serve lại từ thư mục host (xem volumes)
      MEDIA_DIR: /data/media
      RECAP_DIR: /data/recap
    volumes:
      # Host → container. nginx đọc thẳng thư mục host để serve /media/ và /trip/.
      # Container chạy user `node` (uid 1000) — trùng uid của user zah19-team35 trên
      # VPS, nên vps-bootstrap.sh chown 1000:1000 là cả 2 phía cùng ghi/đọc được.
      # (SELinux đang Permissive nên không cần cờ ':z'; nếu bật Enforcing thì thêm ':z')
      - ${MEDIA_HOST_DIR:-/opt/zino/media}:/data/media
      - ${RECAP_HOST_DIR:-/opt/zino/recap}:/data/recap
    healthcheck:
      # Image node:20-alpine không có curl → dùng fetch có sẵn của Node 20
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      # Chặn log ăn hết 35GB disk trong ngày demo
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    # Tên THẬT của volume, cố định, KHÔNG ghép tiền tố project name.
    #
    # Mặc định là `lisa_pgdata` vì đó là volume đang chứa dữ liệu production —
    # tên có từ thời dự án còn gọi là Lisa. Trông lệch với tên Zino, nhưng đổi
    # tên volume nghĩa là bỏ lại dữ liệu, nên cứ để. Muốn đổi thì phải
    # `docker run --rm -v lisa_pgdata:/from -v ten_moi:/to alpine cp -a /from/. /to/`
    # trước, rồi mới sửa dòng này.
    #
    # Máy dev mới muốn DB riêng: đặt PGDATA_VOLUME=zino_dev_pgdata trong .env.
    name: ${PGDATA_VOLUME:-lisa_pgdata}
